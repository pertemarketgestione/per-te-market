<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D4AF37">
    <title>Per Te Market</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root { --primary: #0F172A; --secondary: #D4AF37; --accent: #F8FAFC; }
        body, html { margin: 0; padding: 0; background: var(--primary); font-family: 'Segoe UI', sans-serif; color: var(--accent); overflow: hidden; height: 100%; }

        /* --- ICONE INTEGRATE (BASE64) --- */

        .i-home { -webkit-mask-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTEwIDIwdjZoNHYtNmgydjZoM3YtOWwtOS05LTkgOXY5aDN2LTZoNHoiLz48L3N2Zz4="); }
        .i-gift { -webkit-mask-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTE4IDhoLTVWMmgtMnY2SDZ2MTNoMTJWOHptLTUtNGgydjJoLTJWNHpNNyAxMGg0djNoLTR2LTN6bTYgMGg0djNoLTR2LTN6bS02IDVoNHYzaC00di0zem02IDBoNHYzaC00di0zeiIvPjwvc3ZnPg=="); }
        .i-card { -webkit-mask-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTIgNGg0djE2SDJWMHptNiAwaDJ2MTZIOFYwem00IDBoNHYxN2gtNFYwem02IDBoNHYxN2gtNFYweiIvPjwvc3ZnPg=="); }
        .i-cart { -webkit-mask-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTcgMThjLTEuMSAwLTEuOTkuOS0xLjk5IDJTMTEuOSA0IDIgMTFzLTkgMi05LTJoMTNsMy42LTdoLTQuMjdMMi4xIDNoLTJWNWgybDMuNiA3LjU5LTEuMzUgMi40NWMtLjE2LjI4LS4yNS42MS0uMjUuOTYgMCAxLjEgOSAyIDIgMmgxMnYtMmgtMTIuNDRjLS4xNCAwLS4yNS0uMTEtLjI1LS4yNSAwLS4wMy4wMS0uMDYuMDItLjA5TDUuNyAxMmgxMi41NWguNzVjLjc1IDAgMS40MS0uNDEgMS43NS0xLjAzbDMuNTgtNi40OWMuMDgtLjE0LjEyLS4zMS4xMi0uNDggMC0uNTUtLjQ1LTEtMS0xaC0xNC44NXoiLz48L3N2Zz4="); }
        .i-user { -webkit-mask-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTEyIDEyYy0yLjIxIDAtNC0xLjc5LTQtNHMxLjc5LTQgNC00IDQgMS43OSA0IDQtMS43OSA0LTQgNHptMCAyYzIuNjcgMCA4IDEuMzMgOCA0djJoLTE2di0yYzAtMi42NyA1LjMzLTQgOC00eiIvPjwvc3ZnPg=="); }

        /* --- DASHBOARD & LOGIN --- */
        #splash { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 10000; transition: 0.5s; }
        .logo-ptm { width: 80px; height: 80px; border: 2px solid var(--secondary); border-radius: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        #login-page { height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .glass-box { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border-radius: 30px; padding: 30px; border: 1px solid rgba(212,175,55,0.15); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #1e293b; border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; color: white; box-sizing: border-box; }
        .btn-gold { background: var(--secondary); color: var(--primary); border: none; padding: 16px; width: 100%; border-radius: 50px; font-weight: bold; cursor: pointer; }
        #main-app { display: none; padding: 20px; height: 100vh; overflow-y: auto; padding-bottom: 120px; }
        .fidelity-card { background: linear-gradient(135deg, #1e293b, #0F172A); border: 1px solid var(--secondary); border-radius: 25px; padding: 25px; position: relative; }
        .points-val { font-size: 3rem; color: var(--secondary); font-weight: 800; text-align: center; margin: 15px 0; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: rgba(15, 23, 42, 0.98); border-top: 1px solid rgba(212, 175, 55, 0.3); display: flex; justify-content: space-around; align-items: center; }
        .nav-btn { color: #64748b; font-size: 10px; display: flex; flex-direction: column; align-items: center; cursor: pointer; background: none; border: none; }
        .nav-btn.active { color: var(--secondary); }
        .nav-btn.active .icon-ptm { background-color: var(--secondary); }
        .center-btn { width: 55px; height: 55px; background: var(--secondary); border-radius: 50%; margin-top: -40px; border: 4px solid var(--primary); display: flex; align-items: center; justify-content: center; }
        .center-btn .icon-ptm { background-color: var(--primary) !important; }
        #barcode-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 20000; display: none; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="splash"><div class="logo-ptm"></div></div>
    <div id="login-page">
        <div class="glass-box">
            <h2 style="color: var(--secondary);">Area Clienti</h2>
            <input type="text" id="user" placeholder="User ID">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn-gold" onclick="tentaLogin()">ENTRA NEL CAVEAU</button>
        </div>
    </div>
    <div id="main-app">
        <div class="fidelity-card" onclick="mostraBarcode()">
            <div style="font-size: 11px; color: var(--secondary);">CARTA PER TE</div>
            <div class="points-val" id="display-punti">0</div>
            <div style="font-size: 10px; text-align: right; opacity: 0.6;" id="display-id">ID: ---</div>
        </div>
    </div>
    <div id="barcode-overlay" onclick="this.style.display='none'"><svg id="ean-svg"></svg></div>
    <nav class="nav-bar">
        <button class="nav-btn active"><span class="icon-ptm i-home"></span><br>HOME</button>
        <button class="nav-btn"><span class="icon-ptm i-gift"></span><br>PREMI</button>
        <button class="nav-btn center-btn" onclick="mostraBarcode()"><span class="icon-ptm i-card"></span></button>
        <button class="nav-btn"><span class="icon-ptm i-cart"></span><br>SPESA</button>
        <button class="nav-btn"><span class="icon-ptm i-user"></span><br>PROFILO</button>
    </nav>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwMgKbps8Df21dUXSZ_88OobYaYr-SvSjsfJuCZP1ufmKu5DcJ7TW7_yB2jmV5VHt8M3A/exec";
        let datiCorrenti = null;

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
        
        window.onload = () => { setTimeout(() => { document.getElementById('splash').style.display = 'none'; document.getElementById('login-page').style.display = 'flex'; }, 1500); };

        function tentaLogin() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            if(!user || !pass) return;
            document.getElementById('splash').style.display = 'flex';
            fetch(`${WEB_APP_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`)
            .then(res => res.json()).then(data => {
                document.getElementById('splash').style.display = 'none';
                if(data.status === "SUCCESS") {
                    datiCorrenti = data;
                    document.getElementById('login-page').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    document.getElementById('display-punti').innerText = data.punti;
                    document.getElementById('display-id').innerText = "ID: " + data.idCarta;
                } else { alert(data.message); }
            });
        }
        function mostraBarcode() {
            if(!datiCorrenti) return;
            document.getElementById('barcode-overlay').style.display = 'flex';
            JsBarcode("#ean-svg", datiCorrenti.idCarta, { format: "EAN13", width: 3, height: 100, displayValue: true });
        }
    </script>
</body>
</html>
