<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D4AF37">
    <title>PTM - AI COMMAND CENTER</title>
    <style id="ai-dynamic-css">
        :root { --primary: #0F172A; --secondary: #D4AF37; --accent: #F8FAFC; }
        body, html { margin: 0; padding: 0; background: var(--primary); font-family: 'Segoe UI', sans-serif; color: var(--accent); overflow-x: hidden; }
        
        #splash { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .logo { width: 80px; height: 80px; border: 2px solid var(--secondary); border-radius: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        #login-page { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border-radius: 25px; padding: 30px; border: 1px solid rgba(212,175,55,0.2); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #1e293b; border: 1px solid rgba(212,175,55,0.3); border-radius: 10px; color: white; box-sizing: border-box; }
        .btn { background: var(--secondary); color: var(--primary); border: none; padding: 15px; width: 100%; border-radius: 50px; font-weight: bold; cursor: pointer; }

        #main-app { display: none; padding: 20px; padding-bottom: 100px; }
        .ai-terminal { background: #000; color: #10b981; font-family: monospace; padding: 15px; border-radius: 15px; border: 1px solid var(--secondary); font-size: 12px; height: 150px; overflow-y: auto; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="splash"><div class="logo"></div></div>

    <div id="login-page">
        <div class="glass">
            <h2 style="color:var(--secondary)">AI COMMAND</h2>
            <input type="text" id="user" placeholder="User ID">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn" onclick="tentaLogin()">ACCEDI</button>
        </div>
    </div>

    <div id="main-app">
        <h3 style="color:var(--secondary)">🧠 IA STRATEGICA & CODER</h3>
        <div class="ai-terminal" id="terminal">System Ready. In attesa di istruzioni...</div>
        
        <textarea id="ai-prompt" placeholder="Es: Cambia lo sfondo in blu notte e i testi in oro" style="width:100%; height:80px; background:#1e293b; color:white; border-radius:10px; border:1px solid var(--secondary); padding:10px; box-sizing:border-box;"></textarea>
        
        <button class="btn" style="margin-top:10px;" onclick="chiediAI()">ESEGUI MODIFICA</button>
        
        <div id="apply-zone" style="display:none; margin-top:20px; border-top: 1px solid var(--secondary); padding-top:20px;">
            <p style="color:#10b981; font-size:12px;">✨ Nuovo codice generato con successo.</p>
            <button class="btn" onclick="applicaCodice()">APPLICA MODIFICHE ORA</button>
        </div>

        <div style="margin-top:30px; border: 1px solid var(--secondary); padding:15px; border-radius:15px;">
            <h4 style="color:var(--secondary); margin:0 0 10px 0;">⚙️ CONFIG IA</h4>
            <input type="password" id="ai-key" placeholder="Incolla API KEY Gemini">
            <button class="btn" style="padding:5px;" onclick="salvaKey()">AGGIORNA CHIAVE</button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "IL_TUO_URL_EXEC"; 
        let cacheCodice = { css: "", js: "" };

        window.onload = () => { setTimeout(() => document.getElementById('splash').style.display='none', 1500); };

        function tentaLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            fetch(`${WEB_APP_URL}?action=login&user=${u}&pass=${p}`)
            .then(r => r.json()).then(d => {
                if(d.status === "SUCCESS") {
                    document.getElementById('login-page').style.display='none';
                    document.getElementById('main-app').style.display='block';
                } else { alert("Accesso Negato"); }
            });
        }

        function salvaKey() {
            const k = document.getElementById('ai-key').value;
            const d = JSON.stringify({ provider: "Google", model: "AUTO", key: k });
            fetch(`${WEB_APP_URL}?action=updateAIConfig&data=${encodeURIComponent(d)}`)
            .then(r => r.json()).then(res => alert(res.message));
        }

        function chiediAI() {
            const p = document.getElementById('ai-prompt').value;
            const term = document.getElementById('terminal');
            term.innerHTML += `<br>> Richiesta: ${p}...`;
            
            fetch(`${WEB_APP_URL}?action=askAI&prompt=${encodeURIComponent(p)}`)
            .then(r => r.json()).then(d => {
                const parti = d.risposta.split('|');
                cacheCodice.css = parti[0] || "";
                cacheCodice.js = parti[1] || "";
                term.innerHTML += `<br>> Risposta ricevuta. Codice generato.`;
                document.getElementById('apply-zone').style.display='block';
            });
        }

        function applicaCodice() {
            // Applica CSS
            const style = document.createElement('style');
            style.innerHTML = cacheCodice.css;
            document.head.appendChild(style);
            // Applica JS
            try { eval(cacheCodice.js); } catch(e) { console.log("JS Error", e); }
            
            // Salva nel database
            fetch(`${WEB_APP_URL}?action=saveNewCode&css=${encodeURIComponent(cacheCodice.css)}&js=${encodeURIComponent(cacheCodice.js)}&desc=AI Modifica`)
            .then(() => alert("Sistema Aggiornato!"));
        }
    </script>
</body>
</html>
