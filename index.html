<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D4AF37">
    <title>Per Te Market</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root { --primary: #0F172A; --secondary: #D4AF37; --accent: #F8FAFC; }
        body, html { margin: 0; padding: 0; background: var(--primary); font-family: 'Segoe UI', sans-serif; color: var(--accent); overflow: hidden; height: 100%; }

        /* --- ICONE MINIMALISTE ADATTIVE --- */
        .icon-ptm {
            width: 24px; height: 24px; background-color: var(--secondary);
            display: inline-block; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
            -webkit-mask-size: contain; mask-size: contain;
        }
        .i-home { -webkit-mask-image: url('https://img.icons8.com'); }
        .i-gift { -webkit-mask-image: url('https://img.icons8.com'); }
        .i-card { -webkit-mask-image: url('https://img.icons8.com'); }
        .i-cart { -webkit-mask-image: url('https://img.icons8.com'); }
        .i-user { -webkit-mask-image: url('https://img.icons8.com'); }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
            transition: opacity 0.5s ease;
        }
        .logo-ptm { width: 80px; height: 80px; border: 2px solid var(--secondary); border-radius: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* --- LOGIN --- */
        #login-page { height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .glass-box { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border-radius: 30px; padding: 30px; border: 1px solid rgba(212, 175, 55, 0.15); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #1e293b; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; color: white; box-sizing: border-box; }
        .btn-gold { background: var(--secondary); color: var(--primary); border: none; padding: 16px; width: 100%; border-radius: 50px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* --- DASHBOARD --- */
        #main-app { display: none; padding: 20px; height: 100vh; overflow-y: auto; padding-bottom: 120px; box-sizing: border-box; }
        .fidelity-card { background: linear-gradient(135deg, #1e293b, #0F172A); border: 1px solid var(--secondary); border-radius: 25px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); position: relative; cursor: pointer; }
        .points-val { font-size: 3rem; color: var(--secondary); font-weight: 800; text-align: center; margin: 15px 0; }

        /* --- LISTA SPESA INTELLIGENTE --- */
        .shopping-section { margin-top: 30px; background: rgba(255,255,255,0.03); border-radius: 20px; padding: 15px; border: 1px solid rgba(212, 175, 55, 0.1); }
        .shopping-input { display: flex; gap: 10px; margin-bottom: 15px; }
        .shopping-input input { margin: 0; padding: 10px; font-size: 14px; }
        .add-btn { background: var(--secondary); border: none; border-radius: 10px; padding: 0 15px; font-weight: bold; cursor: pointer; }
        .list-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .category-tag { font-size: 10px; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; }

        /* --- OVERLAY BARCODE --- */
        #barcode-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 20000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #ean-svg { width: 80%; max-height: 250px; }

        /* --- NAV BAR --- */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(10px); border-top: 1px solid rgba(212, 175, 55, 0.3); display: flex; justify-content: space-around; align-items: center; z-index: 5000; }
        .nav-btn { color: #64748b; font-size: 10px; display: flex; flex-direction: column; align-items: center; text-decoration: none; cursor: pointer; border: none; background: none; }
        .nav-btn.active { color: var(--secondary); }
        .nav-btn.active .icon-ptm { background-color: var(--secondary); }
        .nav-btn .icon-ptm { background-color: #64748b; }
        .center-btn { width: 55px; height: 55px; background: var(--secondary); border-radius: 50%; margin-top: -40px; border: 4px solid var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3); }
        .center-btn .icon-ptm { background-color: var(--primary) !important; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="logo-ptm"></div>
        <h3 style="margin-top: 25px; letter-spacing: 4px; color: var(--secondary);">PER TE MARKET</h3>
    </div>

    <div id="login-page">
        <div class="glass-box">
            <h2 style="color: var(--secondary); margin-bottom: 20px;">Area Clienti</h2>
            <input type="text" id="user" placeholder="User ID">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn-gold" onclick="tentaLogin()">ENTRA NEL CAVEAU</button>
        </div>
    </div>

    <div id="main-app">
        <div class="fidelity-card" onclick="mostraBarcode()">
            <div style="font-size: 11px; color: var(--secondary); letter-spacing: 2px;">CARTA PER TE</div>
            <div class="points-val" id="display-punti">0</div>
            <div style="font-size: 10px; text-align: right; opacity: 0.6;" id="display-id">ID: 8000000000000</div>
        </div>

        <div class="shopping-section" id="shopping-ui">
            <div style="font-size: 12px; color: var(--secondary); margin-bottom: 10px; font-weight: bold;">🛒 LISTA SPESA INTELLIGENTE</div>
            <div class="shopping-input">
                <input type="text" id="item-input" placeholder="Cosa ti serve?">
                <button class="add-btn" onclick="aggiungiProdotto()">+</button>
            </div>
            <div id="shopping-list"></div>
        </div>
    </div>

    <div id="barcode-overlay" onclick="chiudiBarcode()">
        <svg id="ean-svg"></svg>
        <p style="color: #666; font-size: 12px; margin-top: 20px;">Tocca per chiudere</p>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="showTab('home')"><span class="icon-ptm i-home"></span><br>HOME</button>
        <button class="nav-btn"><span class="icon-ptm i-gift"></span><br>PREMI</button>
        <button class="nav-btn center-btn" onclick="mostraBarcode()"><span class="icon-ptm i-card"></span></button>
        <button class="nav-btn" onclick="showTab('spesa')"><span class="icon-ptm i-cart"></span><br>SPESA</button>
        <button class="nav-btn"><span class="icon-ptm i-user"></span><br>PROFILO</button>
    </nav>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwMgKbps8Df21dUXSZ_88OobYaYr-SvSjsfJuCZP1ufmKu5DcJ7TW7_yB2jmV5VHt8M3A/exec";
        let datiCorrenti = null;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => { document.getElementById('splash').style.display = 'none'; document.getElementById('login-page').style.display = 'flex'; }, 500);
            }, 1500);
        };

        function tentaLogin() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            if(!user || !pass) return;
            document.getElementById('splash').style.display = 'flex';
            document.getElementById('splash').style.opacity = '1';

            fetch(`${WEB_APP_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('splash').style.display = 'none';
                if(data.status === "SUCCESS") {
                    datiCorrenti = data;
                    document.getElementById('login-page').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    document.getElementById('display-punti').innerText = data.punti;
                    document.getElementById('display-id').innerText = "ID: " + data.idCarta;
                } else { alert(data.message); }
            });
        }

        function aggiungiProdotto() {
            const input = document.getElementById('item-input');
            if(!input.value) return;
            const list = document.getElementById('shopping-list');
            const div = document.createElement('div');
            div.className = 'list-item';
            // Simulazione IA: assegna una categoria in base alla parola
            let cat = "Generico";
            if(/latte|formaggio|yogurt/i.test(input.value)) cat = "Freschi";
            if(/mela|banana|verdura/i.test(input.value)) cat = "Ortofrutta";
            if(/pasta|riso|biscotti/i.test(input.value)) cat = "Dispensa";
            
            div.innerHTML = `<span>${input.value}</span><span class="category-tag">${cat}</span>`;
            list.prepend(div);
            input.value = "";
        }

        function mostraBarcode() {
            if(!datiCorrenti) return;
            document.getElementById('barcode-overlay').style.display = 'flex';
            JsBarcode("#ean-svg", datiCorrenti.idCarta, { format: "EAN13", lineColor: "#000", width: 3, height: 100, displayValue: true });
        }

        function chiudiBarcode() { document.getElementById('barcode-overlay').style.display = 'none'; }
    </script>
</body>
</html>
